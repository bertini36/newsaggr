<head>

  <meta name="keywords" content="news, tech news, real-time news, news aggregator, NewsAggr, headlines, technology" />
  <meta name="author" content="NewsAggr" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://newsaggr.pages.dev/" />

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="NewsAggr - Your daily news aggregator" />
  <meta property="og:description"
    content="Real-time news aggregator bringing you the latest headlines from top sources with an elegant reading experience" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://newsaggr.pages.dev/" />
  <meta property="og:image" content="https://newsaggr.pages.dev/og-image.png" />

  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="NewsAggr - Your daily news aggregator" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NewsAggr - Your daily news aggregator" />
  <meta name="twitter:description"
    content="Real-time news aggregator bringing you the latest headlines from top sources with an elegant reading experience" />
  <meta name="twitter:image" content="https://newsaggr.pages.dev/og-image.png" />

  <meta name="theme-color" content="#0d1117" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
    rel="stylesheet">
  <!-- Optional reading fonts load without blocking the first paint -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&family=Lora:wght@400;700&family=Inter:wght@400;600&family=PT+Serif:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,700&family=IBM+Plex+Sans:wght@400;600&family=Crimson+Text:wght@400;700&family=Work+Sans:wght@400;600&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Source+Sans+3:wght@400;600&family=Lora:wght@400;700&family=Inter:wght@400;600&family=PT+Serif:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,700&family=IBM+Plex+Sans:wght@400;600&family=Crimson+Text:wght@400;700&family=Work+Sans:wght@400;600&display=swap"
      rel="stylesheet">
  </noscript>
  <link rel="preload" href="/Baloo2-Bold.subset.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

  <!-- Schema.org markup for Google -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NewsAggr",
      "url": "https://newsaggr.pages.dev",
      "description": "Real-time news aggregator bringing you the latest headlines from top sources with an elegant reading experience",
    }
  </script>



  <script>
    // Resolve the theme before first paint so a light-mode user never sees a dark flash
    try {
      const saved = localStorage.getItem("darkMode")
      const dark = saved === null ? matchMedia("(prefers-color-scheme: dark)").matches : JSON.parse(saved)
      document.documentElement.classList.toggle("dark", dark)
      document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#0d1117" : "#fbfbfb")
    } catch { }
  </script>

  <script>
    const query = new URLSearchParams(window.location.search)
    if (query.has("login") && query.has("user") && query.has("jwt")) {
      localStorage.setItem("user", query.get("user"))
      localStorage.setItem("jwt", JSON.stringify(query.get("jwt")))
      window.history.replaceState({}, document.title, window.location.pathname)
    }
  </script>
  <title>NewsAggr</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
